[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excavation-video-lab"
version = "0.1.0"
description = "Local excavation video chronometry prototype"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rfdetr[train,augment]==1.11.2",
    "torch",
    "torchvision",
    "trackers",
    "supervision",
    "av",
    "opencv-python-headless",
    "pydantic>=2",
    "typer",
    "pyyaml",
    "pandas",
    "pyarrow",
    "pycocotools",
    "starlette>=1.7.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
    "altair>=6.3.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
excavation = "excavation_lab.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/excavation_lab"]

[tool.pytest.ini_options]
addopts = ["-m", "not manual"]
testpaths = ["tests"]
markers = [
    "manual: real weight download, the doctor train-step, and any optional smoke run",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["workspace", ".venv"]
